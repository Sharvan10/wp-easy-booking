name: Build plugin zip

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: Lint PHP files
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

  phpcs:
    name: WordPress Coding Standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer, cs2pr

      - name: Install dev dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPCS
        run: vendor/bin/phpcs -q --report=checkstyle | cs2pr

  blueprint:
    name: Validate Playground blueprint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check blueprint.json is in sync with bin/demo-data.php
        run: |
          php bin/build-blueprint.php
          git diff --exit-code blueprint.json

      - name: Validate against the official Playground schema
        run: |
          curl -fsSL https://playground.wordpress.net/blueprint-schema.json -o "$RUNNER_TEMP/blueprint-schema.json"
          npx --yes ajv-cli@5 validate --spec=draft7 --strict=false \
            -s "$RUNNER_TEMP/blueprint-schema.json" -d blueprint.json

  build:
    name: Build installable zip
    needs: [lint, phpcs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy distributable files
        run: |
          mkdir -p build/easy-booking
          rsync -a --exclude-from=.distignore ./ build/easy-booking/
          find build -type f | sort

      # The artifact is downloaded as "easy-booking.zip" containing an
      # "easy-booking/" folder, so it can be uploaded straight to
      # Plugins > Add New > Upload Plugin.
      - name: Upload plugin zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: easy-booking
          path: build/
          if-no-files-found: error
          retention-days: 30
